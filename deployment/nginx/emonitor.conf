# /etc/nginx/sites-available/emonitor  (ln -s to sites-enabled)
# TLS certificates via certbot: certbot --nginx -d monitor.example.com

limit_req_zone $binary_remote_addr zone=emonitor_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=emonitor_auth:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream emonitor_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 8m;

    root /opt/emonitor/frontend/dist;
    index index.html;

    # Static SPA assets (hashed filenames → long cache)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /api/v1/auth/login       { limit_req zone=emonitor_auth burst=10 nodelay; proxy_pass http://emonitor_api; include /etc/nginx/snippets/emonitor-proxy.conf; }
    location = /api/v1/auth/forgot-password { limit_req zone=emonitor_auth burst=5 nodelay; proxy_pass http://emonitor_api; include /etc/nginx/snippets/emonitor-proxy.conf; }

    location /api/v1/ws {
        proxy_pass http://emonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=emonitor_api burst=100 nodelay;
        proxy_pass http://emonitor_api;
        include /etc/nginx/snippets/emonitor-proxy.conf;
    }
}
