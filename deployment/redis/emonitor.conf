# Included from /etc/redis/redis.conf by the installer.
bind 127.0.0.1 ::1
protected-mode yes
port 6379
requirepass __SET_BY_INSTALLER__
# Celery broker + ingest stream need persistence across restarts (AOF, fsync every second)
appendonly yes
appendfsync everysec
maxmemory 1gb
# Never evict queue/stream data silently; producers get errors and back off instead.
maxmemory-policy noeviction
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
